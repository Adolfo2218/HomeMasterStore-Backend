# Ejecutar con --spring.profiles.active=mysql después de iniciar MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homemaster?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:homemaster}
spring.datasource.password=${DB_PASSWORD:homemaster_dev}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
