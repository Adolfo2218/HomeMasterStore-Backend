spring.application.name=homemaster-backend
server.port=8080
# Base de datos local persistente para iniciar SIN MySQL
spring.datasource.url=jdbc:h2:file:./datos/homemaster;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html

# JWT: configurar HMS_JWT_SECRET (base64 con al menos 32 bytes aleatorios). No subir secretos al repositorio.
hms.jwt.secret=${HMS_JWT_SECRET:}
hms.jwt.access-minutes=15
hms.refresh.days=7
# Semilla administrativa opcional SOLO para entorno académico
hms.admin.email=${HMS_ADMIN_EMAIL:}
hms.admin.password=${HMS_ADMIN_PASSWORD:}
